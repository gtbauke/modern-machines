<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Wireframe Option {{OPTION_LETTER}}</title>
    <!-- Tailwind CSS CDN for self-contained, portable wireframes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wire: {
                            bg: '#f8fafc',
                            card: '#ffffff',
                            border: '#cbd5e1',
                            dashed: '#94a3b8',
                            muted: '#64748b',
                            text: '#0f172a',
                            primary: '#2563eb',
                            secondary: '#e2e8f0'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Wireframe helper utilities */
        .wireframe-box {
            border: 1.5px dashed #94a3b8;
            background-color: #f1f5f9;
        }
        .wireframe-placeholder {
            background-image: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 10px, #e2e8f0 10px, #e2e8f0 20px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">
    <!-- Wireframe Header & Context Bar -->
    <div class="bg-slate-900 text-white px-6 py-2.5 flex items-center justify-between text-xs font-mono border-b border-slate-800">
        <div class="flex items-center gap-3">
            <span class="bg-blue-600 text-white font-bold px-2 py-0.5 rounded text-[11px]">OPTION {{OPTION_LETTER}}</span>
            <span class="font-semibold text-slate-200">{{DESIGN_NAME}}</span>
            <span class="text-slate-400">|</span>
            <span class="text-slate-400">{{LAYOUT_PARADIGM}}</span>
        </div>
        <div class="text-slate-400">
            Focus: Structural Hierarchy & Flow (Low-Fidelity)
        </div>
    </div>

    <!-- Main Prototype Content -->
    <main class="flex-1 flex overflow-hidden">
        {{CONTENT}}
    </main>

    <!-- Wireframe Footer Notes -->
    <footer class="bg-white border-t border-slate-200 px-6 py-3 text-xs text-slate-500 flex justify-between items-center">
        <div>
            <strong>Key Trade-offs:</strong> {{KEY_TRADEOFFS}}
        </div>
        <div class="text-slate-400">
            Generated by UI Designer Skill
        </div>
    </footer>
</body>
</html>
